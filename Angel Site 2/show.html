<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia do seu site — Angel Studio</title><link rel="stylesheet" href="site.css"><style id="customStyle"></style></head><body data-page="inicio"><div id="siteRoot"></div>
<script src="site-data.js"></script>
<script>
// Esta página é exclusiva do editor e lê a versão atual, não a original.
try {const raw=localStorage.getItem('angel-studio-v4-draft');if(raw){const next=JSON.parse(raw);if(Array.isArray(next.pages)&&next.pages.length)window.ANGEL_SITE=next;}}catch(e){console.warn('Exibindo dados originais',e)}
const currentSlug=new URLSearchParams(location.search).get('p')||'index';const match=window.ANGEL_SITE.pages.find(p=>p.slug===currentSlug);document.body.dataset.page=match?.id||'inicio';
</script>
<script src="site.js"></script>
<script>
// Mantém a navegação dentro da prévia para visualizar páginas ainda não publicadas.
document.addEventListener('click',e=>{const a=e.target.closest('a[href$=".html"]');if(!a)return;const name=a.getAttribute('href')?.replace(/\.html$/,'');if(!window.ANGEL_SITE.pages.some(p=>p.slug===name))return;e.preventDefault();location.href='show.html?p='+encodeURIComponent(name)});
</script></body></html>
